#e o arquivo de configuracao para o ambiente de teste que no nosso caso tera um banco de dados na memoria

springdoc.api-docs.path=/api-doc

#esse e o JDBC URL - esse trecho ele pesquisou no google 'configuracao spring h2 (que e o banco'
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=true

#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
#caminho que coloco no navegador
spring.h2.console.path=/h2-console
